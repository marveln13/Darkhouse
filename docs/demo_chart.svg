<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-label="Price with dark-pool and GEX levels" class="bl-chart" preserveAspectRatio="xMidYMid meet"><style>
svg{--up:#15803d;--down:#b91c1c;--dp:#3b6fd4;--conf:#7c3aed;--blk:#d97706;--grid:#e6e9ef}
@media (prefers-color-scheme:dark){svg{--up:#4ade80;--down:#f87171;--dp:#6b9bf5;--conf:#c084fc;--blk:#fbbf24;--grid:#252b35}}
.chartwrap{position:relative;overflow-x:auto}
.bl-chart{width:100%;min-width:680px;height:auto;display:block;font:11px system-ui,sans-serif}
.grid{stroke:var(--grid);stroke-width:1}
.axis{fill:var(--muted)}
.wick{stroke-width:1}.wick.up{stroke:var(--up)}.wick.down{stroke:var(--down)}
.body.up{fill:var(--up)}.body.down{fill:var(--down)}
.dp{fill:var(--dp);opacity:.28}.dp.conf{fill:var(--conf);opacity:.45}
.gex{stroke:var(--gex);stroke-width:1.5;stroke-dasharray:6 4}
.gex.gamma_flip{stroke-dasharray:2 3;stroke-width:2}
.block{fill:var(--blk);fill-opacity:.35;stroke:var(--blk);stroke-width:1.2}
.lbl{fill:var(--ink);font-size:11px}
.lbl.dp{fill:var(--dp);opacity:1}.lbl.conf{fill:var(--conf)}
.gexlabel{fill:var(--gex)}
.xhair{stroke:var(--muted);stroke-width:1;stroke-dasharray:3 3}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--muted);margin-bottom:6px}
.sw{display:inline-block;width:14px;height:8px;margin-right:6px;vertical-align:middle;border-radius:2px}
.dpsw{background:var(--dp);opacity:.5}.confsw{background:var(--conf);opacity:.7}
.gexsw{border-top:2px dashed var(--gex);height:0}.blocksw{background:var(--blk);opacity:.6;border-radius:50%;width:10px;height:10px}
.readout{min-height:20px;font:13px ui-monospace,monospace;color:var(--muted)}

svg{--ink:#14181f;--muted:#5d6675;--gex:#c2410c;background:#fff}
@media (prefers-color-scheme:dark){svg{--ink:#e8ebf0;--muted:#98a2b3;--gex:#fb923c;background:#171b22}}
